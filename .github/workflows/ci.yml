name: ci

on:
  pull_request:
    branches: [qa, uat, main]
  push:
    branches: [qa, uat, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      NX_DAEMON: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: yarn

      - name: Install
        run: yarn install --immutable

      - name: Commit messages
        if: github.event_name == 'pull_request'
        run: yarn commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }}

      - name: Set Nx base and head
        uses: nrwl/nx-set-shas@v4
        with:
          main-branch-name: ${{ github.base_ref || github.ref_name }}

      - name: Format
        run: yarn format:check

      - name: Architecture
        run: yarn check:arch

      - name: Lint, typecheck, test, build (affected)
        run: yarn nx affected -t lint typecheck test build
